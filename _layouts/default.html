{%- assign t = site.data.titles.langs[page.lang] | default: site.data.titles.langs.en -%}
<!doctype html>
<html lang="{{ page.lang | default: 'en' }}" dir="{% if page.lang == 'he' or page.lang == 'ar' %}rtl{% else %}ltr{% endif %}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ page.title }} — {{ t.app }}</title>
<link rel="stylesheet" href="/assets/style.css">
</head>
<body>
<header><a href="/{{ page.lang | default: 'en' }}/">{{ t.app }} · {{ t.help }}</a></header>
<main>
{{ content }}
</main>
<footer><a href="https://vecturabook.com">vecturabook.com</a></footer>
</body>
</html>
